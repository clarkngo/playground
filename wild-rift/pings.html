<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Rift Ping Board</title>
    <style>
        body {
            background-color: #051923;
            color: #d4af37;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 { text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid #d4af37; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            max-width: 600px;
            width: 100%;
            margin-top: 30px;
        }

        .ping-btn {
            background: linear-gradient(145deg, #0a2e38, #000000);
            border: 2px solid #d4af37;
            border-radius: 8px;
            padding: 20px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .ping-btn:hover { box-shadow: 0 0 15px #d4af37; }
        .ping-btn:active { transform: scale(0.95); }

        .icon { font-size: 24px; }
        .label { font-size: 14px; text-transform: uppercase; }

        /* Specific Ping Colors */
        .attack { border-color: #ff4655; color: #ff4655; }
        .danger { border-color: #ffcc00; color: #ffcc00; }
        .on-my-way { border-color: #00eeff; color: #00eeff; }
        .retreat { border-color: #ff9900; color: #ff9900; }
    </style>
    <meta name="author" content="Clark Ngo">
    <meta name="copyright" content="Clark Ngo">
  </head>
<body>

    <h1>Wild Rift Pings</h1>
    <p>Click a button to trigger the ping sound</p>

    <div class="grid">
        <button class="ping-btn attack" onclick="playPing('attack')">
            <span class="icon">⚔️</span>
            <span class="label">Attack</span>
        </button>

        <button class="ping-btn danger" onclick="playPing('danger')">
            <span class="icon">⚠️</span>
            <span class="label">Danger</span>
        </button>

        <button class="ping-btn on-my-way" onclick="playPing('omw')">
            <span class="icon">🏃</span>
            <span class="label">On My Way</span>
        </button>

        <button class="ping-btn retreat" onclick="playPing('retreat')">
            <span class="icon">🏳️</span>
            <span class="label">Retreat</span>
        </button>

        <button class="ping-btn" onclick="playPing('missing')">
            <span class="icon">❓</span>
            <span class="label">Enemy Missing</span>
        </button>

        <button class="ping-btn" onclick="playPing('group')">
            <span class="icon">🛡️</span>
            <span class="label">Group Up</span>
        </button>
    </div>

    <audio id="attack" src="attack.ogg"></audio>
    <audio id="danger" src="danger.ogg"></audio>
    <audio id="omw" src="omw.ogg"></audio>
    <audio id="retreat" src="retreat.ogg"></audio>
    <audio id="missing" src="missing.ogg"></audio>
    <audio id="group" src="group.ogg"></audio>

    <script>
        function playPing(id) {
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0; // Reset to start if clicked rapidly
                audio.play().catch(e => console.log("Audio file missing or blocked by browser."));
            }
        }
    </script>
<footer style="text-align:center;padding:1rem;border-top:1px solid #ccc;margin-top:2rem;color:#666;font-size:0.8rem;">
    © <span id="copyright-year"></span> Clark Ngo
  </footer>
  <script>document.getElementById('copyright-year').textContent = new Date().getFullYear();</script>
</body>
</html>
