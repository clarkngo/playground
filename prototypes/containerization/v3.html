<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Lab: Containerized Environments</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .terminal-glow { text-shadow: 0 0 5px #4ade80; }
        .strikethrough { text-decoration: line-through; opacity: 0.5; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @keyframes pulse-fast { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .animate-pulse-fast { animation: pulse-fast 0.8s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
    <meta name="author" content="Clark Ngo">
    <meta name="copyright" content="Clark Ngo">
  </head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 flex flex-col">

    <header class="mb-6 border-b border-slate-700 pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-tight">System Architecture Lab</h1>
            <p class="text-xs text-slate-500 uppercase tracking-widest">Environment Parity & Containerization</p>
        </div>
        <div class="flex gap-4">
            <div id="status-badge" class="px-3 py-1 rounded-full bg-slate-800 text-[10px] font-bold border border-slate-700">SYSTEM: OFFLINE</div>
        </div>
    </header>

    <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow">
        
        <div class="lg:col-span-3 bg-slate-800/40 border border-slate-700 rounded-lg p-5">
            <h3 class="text-xs font-bold text-slate-400 mb-4 uppercase">Lab Tasks</h3>
            <ul class="space-y-4 text-sm">
                <li id="task1" class="flex items-center gap-3">
                    <input type="checkbox" id="check1" class="w-4 h-4 rounded border-slate-600 bg-slate-700 pointer-events-none">
                    <label>01: Execute Local Script</label>
                </li>
                <li id="task2" class="flex items-center gap-3">
                    <input type="checkbox" id="check2" class="w-4 h-4 rounded border-slate-600 bg-slate-700 pointer-events-none">
                    <label>02: Build Docker Image</label>
                </li>
                <li id="task3" class="flex items-center gap-3">
                    <input type="checkbox" id="check3" class="w-4 h-4 rounded border-slate-600 bg-slate-700 pointer-events-none">
                    <label>03: Confirm Image Registry</label>
                </li>
                <li id="task4" class="flex items-center gap-3">
                    <input type="checkbox" id="check4" class="w-4 h-4 rounded border-slate-600 bg-slate-700 pointer-events-none">
                    <label>04: Shell into Container</label>
                </li>
            </ul>
            <div class="mt-8 pt-6 border-t border-slate-700">
                <div class="text-[10px] text-slate-500 mb-1">COMPLETION PROGRESS</div>
                <div class="w-full bg-slate-700 h-1 rounded-full overflow-hidden">
                    <div id="progressBar" class="bg-blue-500 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-5 bg-slate-800 rounded-xl shadow-2xl overflow-hidden flex flex-col border border-slate-700">
            <div class="bg-slate-700/50 px-4 py-2 flex items-center justify-between">
                <span class="px-3 py-1 bg-slate-900 rounded text-[10px] text-blue-400 font-mono">app.py</span>
                <button onclick="runLocal()" class="text-[10px] font-bold bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded transition">RUN LOCAL</button>
            </div>
            <textarea id="editor" class="flex-grow bg-slate-900 p-6 font-mono text-sm text-slate-300 focus:outline-none resize-none leading-relaxed" spellcheck="false">
# Task 01: Verify Local Runtime
def hello_world():
    print("Hello World from the Local Environment!")

if __name__ == "__main__":
    hello_world()
            </textarea>
        </div>

        <div class="lg:col-span-4 flex flex-col gap-6">
            <div class="bg-slate-800 border border-slate-700 rounded-lg p-4 flex-grow relative overflow-hidden">
                <h3 class="text-xs font-bold text-slate-500 mb-4 uppercase">System Visualizer</h3>
                <div id="viz-area" class="h-48 flex flex-col items-center justify-center border border-slate-700 rounded bg-slate-900/50 transition-all duration-700">
                    <div id="viz-icon" class="text-slate-700 text-4xl mb-2">⬢</div>
                    <div id="viz-text" class="text-[10px] text-slate-500 uppercase tracking-tighter">No Image Detected</div>
                </div>
            </div>

            <div class="bg-black border border-slate-700 rounded-lg p-4 h-56 overflow-hidden flex flex-col font-mono text-xs shadow-2xl">
                <div id="terminal" class="flex-grow overflow-y-auto text-green-500 space-y-1 scrollbar-hide pb-2">
                    <div class="text-slate-500 italic">-- Terminal Initialized --</div>
                    <div class="text-slate-500 italic">Type 'help' for commands.</div>
                </div>
                <div class="flex mt-2 border-t border-slate-800 pt-2 items-center">
                    <span id="prompt-label" class="text-blue-400 mr-2">$</span>
                    <input id="terminal-input" type="text" class="bg-transparent focus:outline-none flex-grow text-white" placeholder="..." autocomplete="off">
                </div>
            </div>
        </div>
    </main>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('terminal-input');
        const progressBar = document.getElementById('progressBar');
        const vizArea = document.getElementById('viz-area');
        const vizText = document.getElementById('viz-text');
        const vizIcon = document.getElementById('viz-icon');
        const statusBadge = document.getElementById('status-badge');
        const promptLabel = document.getElementById('prompt-label');

        let isContainerMode = false;

        function log(msg, color='text-green-500') {
            const line = document.createElement('div');
            line.className = color;
            line.innerHTML = `> ${msg}`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function updateTask(num) {
            const checkbox = document.getElementById(`check${num}`);
            const listItem = document.getElementById(`task${num}`);
            if (!checkbox.checked) {
                checkbox.checked = true;
                listItem.classList.add('strikethrough', 'text-blue-400');
                const progress = (document.querySelectorAll('input[type="checkbox"]:checked').length / 4) * 100;
                progressBar.style.width = `${progress}%`;
            }
        }

        function runLocal() {
            log("Executing app.py via Local Python 3.12...", "text-blue-400");
            setTimeout(() => {
                log("Hello World from the Local Environment!", "text-white");
                updateTask(1);
            }, 600);
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cmd = input.value.trim();
                log(cmd, "text-slate-400");
                input.value = '';

                handleCommand(cmd.toLowerCase());
            }
        });

        function handleCommand(cmd) {
            if (isContainerMode && cmd !== 'exit') {
                if (cmd === 'ls') log("usr/  src/  app/  bin/");
                else log(`sh: ${cmd}: command not found`);
                return;
            }

            if (cmd === 'help') {
                log("Available: docker build, docker image ls, docker run, clear, help", "text-slate-500");
            } else if (cmd === 'clear') {
                terminal.innerHTML = '';
            } else if (cmd.startsWith('docker build')) {
                // Implementation of Section 3.3 [cite: 63, 219]
                log("Building image from Dockerfile specifications...", "text-yellow-500");
                vizText.innerText = "Building Image...";
                vizArea.classList.add('border-yellow-500/50');
                
                setTimeout(() => {
                    log("[1/3] FROM ubuntu:20.04", "text-slate-500");
                    log("[2/3] RUN apt update && install", "text-slate-500");
                    log("[3/3] EXPORTING Image: lab-service:v1", "text-slate-500");
                    log("Successfully built 3d4284ea5b3d", "text-green-400 font-bold");
                    
                    statusBadge.innerText = "SYSTEM: IMAGE CREATED";
                    statusBadge.className = "px-3 py-1 rounded-full bg-blue-900/30 text-[10px] font-bold border border-blue-500 text-blue-400";
                    vizIcon.innerHTML = "📦";
                    vizIcon.className = "text-4xl mb-2 text-blue-400";
                    vizText.innerText = "lab-service:v1";
                    updateTask(2);
                }, 1500);
            } else if (cmd === 'docker image ls') {
                // Implementation of Section 3.4 [cite: 246, 252]
                log("REPOSITORY    TAG       IMAGE ID       SIZE", "text-blue-300");
                log("lab-service   latest    3d4284ea5b3d   173MB", "text-blue-300");
                updateTask(3);
            } else if (cmd.startsWith('docker run')) {
                // Implementation of Section 3.5 [cite: 260, 264]
                if (!document.getElementById('check2').checked) {
                    log("Error: No image built. Run 'docker build' first.", "text-red-400");
                    return;
                }
                log("Creating container instance...", "text-yellow-500");
                setTimeout(() => {
                    isContainerMode = true;
                    promptLabel.innerText = "root@3d4284ea:/usr/src#";
                    log("Switched to container shell.", "text-white font-bold underline");
                    updateTask(4);
                    statusBadge.innerText = "SYSTEM: CONTAINER RUNNING";
                    statusBadge.className = "px-3 py-1 rounded-full bg-green-900/30 text-[10px] font-bold border border-green-500 text-green-400";
                    vizArea.classList.add('animate-pulse');
                }, 800);
            } else if (cmd === 'exit') {
                isContainerMode = false;
                promptLabel.innerText = "$";
                log("Exited container shell.", "text-slate-500");
                vizArea.classList.remove('animate-pulse');
            } else {
                log(`Command '${cmd}' not recognized.`);
            }
        }
    </script>
<footer style="text-align:center;padding:1rem;border-top:1px solid #ccc;margin-top:2rem;color:#666;font-size:0.8rem;">
    © <span id="copyright-year"></span> Clark Ngo
  </footer>
  <script>document.getElementById('copyright-year').textContent = new Date().getFullYear();</script>
</body>
</html>
