<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architect Simulator - Level 1 (Pixel Dev)</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --accent: #58a6ff;
            --danger: #f85149;
            --success: #3fb950;
            --text: #c9d1d9;
            --pixel-scale: 2px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        /* Sidebar UI */
        #sidebar {
            width: 300px;
            background: var(--panel);
            border-right: 1px solid #30363d;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .stat-card {
            background: #090c10;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Simulation Canvas */
        #game-container {
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle, #1c2128 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .node {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #21262d;
            border: 2px solid #30363d;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.8rem;
            transition: border-color 0.3s;
            z-index: 2;
        }

        .node.overloaded { border-color: var(--danger); box-shadow: 0 0 15px var(--danger); }

        .packet {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            filter: blur(1px);
            z-index: 1;
        }

        #log {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 300px;
            height: 100px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            font-family: monospace;
            font-size: 0.75rem;
            overflow-y: auto;
            border-radius: 5px;
            z-index: 10;
        }

        /* PIXEL ART CHARACTER (Pure CSS) */
        #dev-container {
            position: absolute;
            left: 360px; /* Positions dev near servers */
            top: 55%;
            transform: scale(var(--pixel-scale)); /* Scale pixel art up */
            z-index: 5;
        }

        .pixel-art {
            width: 20px;
            height: 24px;
            position: relative;
        }

        /* Character Parts & Colors */
        .px-desk { position: absolute; bottom: 0; left: 0; width: 20px; height: 6px; background: #8b4513; }
        .px-terminal { position: absolute; bottom: 6px; left: 4px; width: 12px; height: 8px; background: #333; }
        .px-screen { position: absolute; top: 1px; left: 1px; width: 10px; height: 6px; background: #58a6ff; }
        
        .px-body { position: absolute; bottom: 0; left: 21px; width: 10px; height: 12px; background: #d1b48c; border-radius: 2px; }
        .px-hair { position: absolute; top: -6px; left: 0px; width: 10px; height: 6px; background: #555; }
        .px-shirt { position: absolute; top: 0px; left: 0px; width: 10px; height: 8px; background: #c9d1d9; }
        .px-arm { position: absolute; top: 1px; left: -3px; width: 4px; height: 6px; background: #d1b48c; animation: typing-idle 0.5s infinite; transform-origin: top; }

        /* Animation States */
        @keyframes typing-idle {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-20deg); }
        }

        @keyframes typing-panic {
            0%, 100% { transform: rotate(0deg) translateX(0); }
            25% { transform: rotate(-30deg) translateX(-1px); }
            50% { transform: rotate(0deg) translateX(1px); }
            75% { transform: rotate(-30deg) translateX(-1px); }
        }

        /* Panic State applied by JS */
        #dev-container.panic .px-arm {
            animation: typing-panic 0.1s infinite;
            background: var(--danger);
        }
        
        #dev-container.panic .px-screen {
            background: var(--danger);
        }

    </style>
    <meta name="author" content="Clark Ngo">
    <meta name="copyright" content="Clark Ngo">
  </head>
<body>

    <div id="sidebar">
        <h2>Level 1: Viral Blog</h2>
        <div class="stat-card">
            <span class="label">Current Traffic</span>
            <span id="traffic-ui" class="stat-value">0 RPS</span>
        </div>
        <div class="stat-card">
            <span class="label">Error Rate</span>
            <span id="error-ui" class="stat-value">0%</span>
        </div>
        <div class="stat-card">
            <span class="label">Budget</span>
            <span id="money-ui" class="stat-value">$500</span>
        </div>

        <hr style="border:0; border-top:1px solid #30363d; width:100%;">
        
        <button id="add-server-btn" onclick="addServer()">Add Server ($200)</button>
        <button id="add-cache-btn" onclick="addCache()">Deploy Redis Cache ($150)</button>
        
        <p style="font-size: 0.8rem; color: #8b949e;">
            Survival Tip: If the dots turn red, your server is dropping connections. Scale out!
        </p>
    </div>

    <div id="game-container">
        <div id="dev-container">
            <div class="pixel-art">
                <div class="px-desk"></div>
                <div class="px-terminal">
                    <div class="px-screen"></div>
                </div>
                <div class="px-body">
                    <div class="px-hair"></div>
                    <div class="px-shirt"></div>
                    <div class="px-arm"></div>
                </div>
            </div>
        </div>

        <div id="node-users" class="node" style="top: 50%; left: 50px; transform: translateY(-50%);">
            <b>Internet</b><br>Traffic Source
        </div>
        
        <div id="server-container">
            <div id="node-server-1" class="node server" style="top: 50%; left: 350px; transform: translateY(-50%);">
                <b>Server 1</b><br><span class="load">0/40</span>
            </div>
        </div>

        <div id="node-db" class="node" style="top: 50%; right: 50px; transform: translateY(-50%);">
            <b>Database</b><br>Postgres
        </div>

        <div id="log">Initializing architecture...</div>
    </div>

<script>
    const state = {
        rps: 5,
        targetRps: 130, // Increased slightly for more pressure
        money: 500,
        errors: 0,
        totalReqs: 0,
        servers: 1,
        hasCache: false,
        serverCapacity: 40
    };

    const container = document.getElementById('game-container');
    const log = document.getElementById('log');
    const dev = document.getElementById('dev-container');

    function updateUI() {
        document.getElementById('traffic-ui').innerText = `${Math.floor(state.rps)} RPS`;
        document.getElementById('money-ui').innerText = `$${state.money}`;
        const errorRate = state.totalReqs > 0 ? ((state.errors / state.totalReqs) * 100).toFixed(1) : 0;
        document.getElementById('error-ui').innerText = `${errorRate}%`;
        
        document.getElementById('add-server-btn').disabled = state.money < 200;
        document.getElementById('add-cache-btn').disabled = state.money < 150 || state.hasCache;
    }

    function addMessage(msg) {
        const div = document.createElement('div');
        div.innerText = `> ${msg}`;
        log.prepend(div);
        if (log.children.length > 5) log.lastChild.remove();
    }

    function spawnPacket() {
        state.totalReqs++;
        const packet = document.createElement('div');
        packet.className = 'packet';
        container.appendChild(packet);

        const start = { x: 100, y: window.innerHeight / 2 };
        const end = { x: 350, y: window.innerHeight / 2 };
        const dbX = window.innerWidth - 100;

        // Visual animation logic
        let progress = 0;
        const totalCapacity = state.servers * state.serverCapacity;
        const isError = (state.rps > totalCapacity) && (Math.random() > totalCapacity / state.rps);

        function animate() {
            progress += 0.02;
            if (progress < 0.5) {
                // To Server
                packet.style.left = (start.x + (end.x - start.x) * (progress * 2)) + 'px';
                packet.style.top = start.y + 'px';
            } else if (progress < 1.0) {
                // To DB (if not errored)
                if (isError) {
                    packet.style.backgroundColor = 'var(--danger)';
                    packet.style.opacity = 1 - (progress - 0.5) * 2;
                } else {
                    packet.style.left = (end.x + (dbX - end.x) * ((progress - 0.5) * 2)) + 'px';
                }
            } else {
                if (isError) state.errors++;
                packet.remove();
                return;
            }
            requestAnimationFrame(animate);
        }
        animate();
    }

    function addServer() {
        if (state.money >= 200) {
            state.money -= 200;
            state.servers++;
            const newServer = document.createElement('div');
            newServer.className = 'node server overloaded'; // Add overloaded immediately so transition works
            newServer.style.left = '350px';
            newServer.style.top = (10 + (state.servers * 105)) + 'px';
            newServer.innerHTML = `<b>Server ${state.servers}</b><br><span class="load">0/40</span>`;
            document.getElementById('server-container').appendChild(newServer);
            addMessage(`Provisioned Server ${state.servers}.`);
            
            // Re-center character near the "middle" of the server stack
            dev.style.top = `calc(50% + ${ (state.servers - 1) * 30 }px)`;
            updateUI();
        }
    }

    function addCache() {
        if (state.money >= 150) {
            state.money -= 150;
            state.hasCache = true;
            state.serverCapacity += 30; // Redis reduces load on DB/Server logic
            addMessage("Redis Cache deployed. Efficiency up.");
            updateUI();
        }
    }

    // Main Game Loop
    setInterval(() => {
        // Traffic ramps up over time
        if (state.rps < state.targetRps) state.rps += 0.5;
        
        // Spawn packets based on RPS
        const packetsToSpawn = Math.max(1, Math.floor(state.rps / 10));
        for(let i=0; i<packetsToSpawn; i++) {
            setTimeout(spawnPacket, Math.random() * 1000);
        }

        // Update Server Load Visualization & Developer state
        const totalCap = state.servers * state.serverCapacity;
        const errorRate = state.totalReqs > 0 ? (state.errors / state.totalReqs) : 0;
        
        if (state.rps > totalCap || errorRate > 0.05) {
            // CRITICAL LOAD - Panic
            dev.classList.add('panic');
            if(Math.random() < 0.1) addMessage("CPU pegging 100%!");
            
            document.querySelectorAll('.server').forEach(s => s.classList.add('overloaded'));
        } else {
            // NORMAL LOAD
            dev.classList.remove('panic');
            document.querySelectorAll('.server').forEach(s => s.classList.remove('overloaded'));
        }

        updateUI();
    }, 1000);

    addMessage("Level started. Traffic light.");
</script>
<footer style="text-align:center;padding:1rem;border-top:1px solid #ccc;margin-top:2rem;color:#666;font-size:0.8rem;">
    © <span id="copyright-year"></span> Clark Ngo
  </footer>
  <script>document.getElementById('copyright-year').textContent = new Date().getFullYear();</script>
</body>
</html>
