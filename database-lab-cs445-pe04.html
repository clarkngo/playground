<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Database Lab Simulator</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; margin: 0; padding: 20px; }
        .adminer-box { background: white; border: 1px solid #ccc; max-width: 950px; margin: auto; box-shadow: 2px 2px 10px rgba(0,0,0,0.1); }
        .header { background: #eee; padding: 10px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; }
        .sidebar { width: 180px; border-right: 1px solid #ccc; padding: 15px; float: left; min-height: 550px; }
        .main-content { padding: 20px; margin-left: 200px; min-height: 550px; }
        textarea { width: 100%; height: 120px; font-family: monospace; margin-bottom: 10px; border: 1px solid #999; }
        button { padding: 6px 20px; cursor: pointer; background: #e1e1e1; border: 1px solid #999; font-weight: bold; }
        .success-msg { color: #2d5a27; background: #e7efed; padding: 10px; border: 1px solid #c3d9cf; margin-bottom: 15px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9em; }
        table, th, td { border: 1px solid #ccc; }
        th, td { padding: 10px; text-align: left; }
        th { background: #f8f8f8; }
        .status-bar { font-size: 0.85em; margin-bottom: 10px; color: #666; }
    </style>
</head>
<body>

<div class="adminer-box">
    <div class="header">
        <strong>Adminer 5.2.1</strong>
        <span>Logged as: root@localhost</span>
    </div>

    <div class="sidebar">
        <div><strong>DB:</strong> <span>customer_db</span></div>
        <hr>
        <p style="color: blue; text-decoration: underline; cursor: pointer;">SQL command</p>
        <hr>
        <strong>Tables:</strong>
        <p>customers</p>
    </div>

    <div class="main-content">
        <div class="status-bar">MySQL » mysql-server » customer_db » SQL command</div>
        <div id="success-banner" class="success-msg"></div>
        
        <textarea id="sql-input" placeholder="Enter your SQL query here..."></textarea>
        <br>
        <button onclick="executeSQL()">Execute</button>

        <div id="result-area" style="display:none; margin-top: 20px;">
            <h3 style="margin-bottom: 5px;">Selected Records</h3>
            <table id="data-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
            <p id="row-count" style="font-weight: bold;"></p>
        </div>
    </div>
</div>

<script>
    // Initial dataset matching the provided table image
    let customerData = [
        { id: 1, address: '84 Arcadia Dr.', zip: '44145', name: 'John Smith', state: 'OH', city: 'Westlake' },
        { id: 2, address: '8691 Rockledge Street', zip: '12302', name: 'Jane Doe', state: 'NY', city: 'Schenectady' },
        { id: 3, address: '6 Tallwood Road', zip: '97402', name: 'Tom Tucker', state: 'OR', city: 'Eugene' },
        { id: 4, address: '37 Chestnut Rd.', zip: '48150', name: 'Jack Hill', state: 'MI', city: 'Livonia' },
        { id: 5, address: '909 Hidden Pond Road', zip: '44145', name: 'Mark Stone', state: 'OH', city: 'Westlake' }
    ];

    function executeSQL() {
        const sql = document.getElementById('sql-input').value.trim().toUpperCase();
        const banner = document.getElementById('success-banner');
        const resArea = document.getElementById('result-area');
        
        banner.style.display = "block";
        resArea.style.display = "none";

        // Query 1 & 6: SELECT ALL
        if (sql === "SELECT * FROM CUSTOMERS") {
            banner.innerText = "Query executed OK.";
            renderTable(customerData, ['id', 'address', 'zip', 'name', 'state', 'city']);
        }
        // Query 2: SELECT OHIO
        else if (sql.includes("WHERE STATE = 'OH'")) {
            banner.innerText = "Query executed OK.";
            const filtered = customerData.filter(c => c.state === 'OH');
            renderTable(filtered, ['id', 'address', 'zip', 'name', 'state', 'city']);
        }
        // Query 3: NAME/ADDRESS IN WESTLAKE
        else if (sql.includes("CITY = 'WESTLAKE'")) {
            banner.innerText = "Query executed OK.";
            const filtered = customerData.filter(c => c.city === 'Westlake');
            renderTable(filtered, ['name', 'address']);
        }
        // Query 4: UPDATE JANE DOE
        else if (sql.includes("UPDATE CUSTOMERS") && sql.includes("NAME = 'JANE DOE'")) {
            customerData = customerData.map(c => c.name === 'Jane Doe' ? {...c, zip: '12303'} : c);
            banner.innerText = "Query executed OK, 1 row affected.";
        }
        // Query 5: DELETE JACK HILL
        else if (sql.includes("DELETE FROM CUSTOMERS") && sql.includes("JACK HILL")) {
            customerData = customerData.filter(c => c.name !== 'Jack Hill');
            banner.innerText = "Query executed OK, 1 row affected.";
        }
        else {
            banner.style.backgroundColor = "#fee";
            banner.style.color = "#a00";
            banner.innerText = "Error: Check your SQL syntax against the answer key.";
        }
    }

    function renderTable(rows, columns) {
        const resArea = document.getElementById('result-area');
        const head = document.getElementById('table-head');
        const body = document.getElementById('table-body');
        const count = document.getElementById('row-count');
        
        resArea.style.display = "block";
        
        // Build Header
        head.innerHTML = "<tr>" + columns.map(col => `<th>${col.charAt(0).toUpperCase() + col.slice(1)}</th>`).join('') + "</tr>";
        
        // Build Body
        body.innerHTML = rows.map(r => {
            return "<tr>" + columns.map(col => `<td>${r[col]}</td>`).join('') + "</tr>";
        }).join('');

        count.innerText = rows.length + " row(s)";
    }
</script>
</body>
</html>
