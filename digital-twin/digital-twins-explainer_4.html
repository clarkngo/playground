<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twins Explained</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Simple SVG icon components
        const ActivityIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        );

        const ThermometerIcon = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
        );

        const SettingsIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        );

        const ZapIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
        );

        function DigitalTwinExplainer() {
            const [temperature, setTemperature] = useState(65);
            const [speed, setSpeed] = useState(1200);
            const [isRunning, setIsRunning] = useState(true);
            const [activeSection, setActiveSection] = useState('concept');
            const [activeDemo, setActiveDemo] = useState(null);
            const [selectedCourse, setSelectedCourse] = useState(null);
            
            // Demo-specific states
            const [buildingTemp, setBuildingTemp] = useState(72);
            const [energyUsage, setEnergyUsage] = useState(85);
            const [factoryEfficiency, setFactoryEfficiency] = useState(94);
            const [engineHealth, setEngineHealth] = useState(98);
            const [trafficFlow, setTrafficFlow] = useState(75);
            const [patientWaitTime, setPatientWaitTime] = useState(15);
            const [milesSimulated, setMilesSimulated] = useState(1245678);

            // Simulate real-time data changes
            useEffect(() => {
                if (!isRunning) return;
                
                const interval = setInterval(() => {
                    setTemperature(prev => Math.min(95, prev + Math.random() * 2 - 0.5));
                    setSpeed(prev => Math.max(800, Math.min(1500, prev + Math.random() * 40 - 20)));
                }, 1000);

                return () => clearInterval(interval);
            }, [isRunning]);

            // Building demo simulation
            useEffect(() => {
                const interval = setInterval(() => {
                    setBuildingTemp(prev => Math.max(68, Math.min(76, prev + Math.random() * 0.6 - 0.3)));
                    setEnergyUsage(prev => Math.max(60, Math.min(100, prev + Math.random() * 4 - 2)));
                }, 2000);
                return () => clearInterval(interval);
            }, []);

            // Factory demo simulation
            useEffect(() => {
                const interval = setInterval(() => {
                    setFactoryEfficiency(prev => Math.max(85, Math.min(99, prev + Math.random() * 2 - 1)));
                }, 1500);
                return () => clearInterval(interval);
            }, []);

            // Engine demo simulation
            useEffect(() => {
                const interval = setInterval(() => {
                    setEngineHealth(prev => Math.max(92, Math.min(100, prev + Math.random() * 0.8 - 0.4)));
                }, 2500);
                return () => clearInterval(interval);
            }, []);

            // Traffic demo simulation
            useEffect(() => {
                const interval = setInterval(() => {
                    setTrafficFlow(prev => Math.max(40, Math.min(95, prev + Math.random() * 10 - 5)));
                }, 3000);
                return () => clearInterval(interval);
            }, []);

            // Healthcare demo simulation
            useEffect(() => {
                const interval = setInterval(() => {
                    setPatientWaitTime(prev => Math.max(5, Math.min(30, prev + Math.random() * 4 - 2)));
                }, 2000);
                return () => clearInterval(interval);
            }, []);

            // Autonomous vehicle demo simulation
            useEffect(() => {
                const interval = setInterval(() => {
                    setMilesSimulated(prev => prev + Math.floor(Math.random() * 50 + 20));
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            const getHealthStatus = () => {
                if (temperature > 85 || speed > 1400) return { status: 'Warning', color: 'text-orange-500' };
                if (temperature > 75 || speed > 1350) return { status: 'Monitor', color: 'text-yellow-500' };
                return { status: 'Healthy', color: 'text-green-500' };
            };

            const health = getHealthStatus();

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">

                            <h1 className="text-4xl font-bold text-gray-800 mb-3">Digital Twins Explained</h1>
                            <p className="text-lg text-gray-600">A virtual replica that mirrors a real-world object in real-time</p>
                        </div>

                        {/* Navigation */}
                        <div className="flex gap-2 mb-6 justify-center flex-wrap">
                            <button
                                onClick={() => setActiveSection('concept')}
                                className={`px-4 py-2 rounded-lg font-medium transition-colors ${
                                    activeSection === 'concept' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'
                                }`}
                            >
                                The Concept
                            </button>
                            <button
                                onClick={() => setActiveSection('demo')}
                                className={`px-4 py-2 rounded-lg font-medium transition-colors ${
                                    activeSection === 'demo' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'
                                }`}
                            >
                                Live Demo
                            </button>
                            <button
                                onClick={() => setActiveSection('examples')}
                                className={`px-4 py-2 rounded-lg font-medium transition-colors ${
                                    activeSection === 'examples' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'
                                }`}
                            >
                                Real Examples
                            </button>
                            <button
                                onClick={() => setActiveSection('learning')}
                                className={`px-4 py-2 rounded-lg font-medium transition-colors ${
                                    activeSection === 'learning' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'
                                }`}
                            >
                                Learning Path
                            </button>
                            <button
                                onClick={() => setActiveSection('course')}
                                className={`px-4 py-2 rounded-lg font-medium transition-colors ${
                                    activeSection === 'course' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'
                                }`}
                            >
                                10-Week Course
                            </button>
                        </div>

                        {/* Content Sections */}

                                    <div className="flex items-start gap-4">
                                        <div className="flex-shrink-0 w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                                            <span className="text-2xl">🏭</span>
                                        </div>
                                        <div>
                                            <h3 className="font-semibold text-lg mb-2">Think of it like...</h3>
                                            <p className="text-gray-600">Imagine having a video game version of your car that updates in real-time. If your real car's engine temperature rises, the virtual car shows it too. If you simulate a problem in the virtual car, you can fix the real one before it breaks down.</p>
                                        </div>
                                    </div>

                                    <div className="flex items-start gap-4">
                                        <div className="flex-shrink-0 w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                                            <ActivityIcon className="w-6 h-6 text-green-600" />
                                        </div>
                                        <div>
                                            <h3 className="font-semibold text-lg mb-2">How it works</h3>
                                            <p className="text-gray-600">Sensors on the real object (machine, building, etc.) constantly send data to the digital version. The digital twin uses this data to match the real thing exactly, allowing you to monitor, test, and predict without touching the physical object.</p>
                                        </div>
                                    </div>

                                    <div className="flex items-start gap-4">
                                        <div className="flex-shrink-0 w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                                            <ZapIcon className="w-6 h-6 text-purple-600" />
                                        </div>
                                        <div>
                                            <h3 className="font-semibold text-lg mb-2">Why it matters</h3>
                                            <p className="text-gray-600">Instead of waiting for things to break, you can predict problems, test solutions safely, optimize performance, and save money. It's like having a crystal ball for your equipment.</p>
                                        </div>
                                    </div>
                                </div>

                                {/* New: The Three Core Components */}
                                <div className="mt-8 pt-8 border-t border-gray-200">
                                    <h3 className="text-xl font-bold text-gray-800 mb-4">The Three Core Components</h3>
                                    <div className="grid md:grid-cols-3 gap-4">
                                        <div className="bg-gradient-to-br from-blue-50 to-blue-100 rounded-lg p-5">

                                        </div>
                                        <div className="bg-gradient-to-br from-green-50 to-green-100 rounded-lg p-5">
                                            <div className="text-3xl mb-2">🔄</div>
                                            <h4 className="font-bold mb-2">3. Data Connection</h4>
                                            <p className="text-sm text-gray-700">Real-time data flow between physical and digital, enabling continuous synchronization.</p>
                                        </div>
                                    </div>
                                </div>

                                {/* New: Key Benefits */}
                                <div className="mt-8 pt-8 border-t border-gray-200">
                                    <h3 className="text-xl font-bold text-gray-800 mb-4">Key Benefits</h3>
                                    <div className="grid md:grid-cols-2 gap-4">
                                        <div className="flex gap-3">
                                            <div className="flex-shrink-0 w-8 h-8 bg-green-100 rounded-full flex items-center justify-center text-green-600 font-bold">✓</div>
                                            <div>
                                                <h4 className="font-semibold text-gray-800">Predictive Maintenance</h4>
                                                <p className="text-sm text-gray-600">Catch problems before they cause expensive breakdowns or safety issues.</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-3">
                                            <div className="flex-shrink-0 w-8 h-8 bg-green-100 rounded-full flex items-center justify-center text-green-600 font-bold">✓</div>
                                            <div>
                                                <h4 className="font-semibold text-gray-800">Risk-Free Testing</h4>
                                                <p className="text-sm text-gray-600">Try out changes virtually before implementing them in the real world.</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-3">
                                            <div className="flex-shrink-0 w-8 h-8 bg-green-100 rounded-full flex items-center justify-center text-green-600 font-bold">✓</div>
                                            <div>
                                                <h4 className="font-semibold text-gray-800">Performance Optimization</h4>
                                                <p className="text-sm text-gray-600">Find the most efficient settings without trial and error on real equipment.</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-3">
                                            <div className="flex-shrink-0 w-8 h-8 bg-green-100 rounded-full flex items-center justify-center text-green-600 font-bold">✓</div>
                                            <div>
                                                <h4 className="font-semibold text-gray-800">Remote Monitoring</h4>
                                                <p className="text-sm text-gray-600">Check status and diagnose issues from anywhere in the world.</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-3">
                                            <div className="flex-shrink-0 w-8 h-8 bg-green-100 rounded-full flex items-center justify-center text-green-600 font-bold">✓</div>
                                            <div>
                                                <h4 className="font-semibold text-gray-800">Cost Reduction</h4>
                                                <p className="text-sm text-gray-600">Reduce downtime, energy usage, and maintenance costs significantly.</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-3">
                                            <div className="flex-shrink-0 w-8 h-8 bg-green-100 rounded-full flex items-center justify-center text-green-600 font-bold">✓</div>
                                            <div>
                                                <h4 className="font-semibold text-gray-800">Training & Simulation</h4>
                                                <p className="text-sm text-gray-600">Train operators on the digital twin without risking damage to real equipment.</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* New: Digital Twin vs Traditional Simulation */}
                                <div className="mt-8 pt-8 border-t border-gray-200">
                                    <h3 className="text-xl font-bold text-gray-800 mb-4">Digital Twin vs. Traditional Simulation</h3>
                                    <div className="bg-gray-50 rounded-lg overflow-hidden">
                                        <table className="w-full">
                                            <thead className="bg-gray-200">
                                                <tr>
                                                    <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Feature</th>
                                                    <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Traditional Simulation</th>
                                                    <th className="px-4 py-3 text-left text-sm font-semibold text-gray-700">Digital Twin</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-200">
                                                <tr>
                                                    <td className="px-4 py-3 text-sm font-medium text-gray-800">Data Source</td>
                                                    <td className="px-4 py-3 text-sm text-gray-600">Theoretical/historical</td>
                                                    <td className="px-4 py-3 text-sm text-green-600 font-medium">Real-time from sensors</td>
                                                </tr>
                                                <tr className="bg-gray-50">
                                                    <td className="px-4 py-3 text-sm font-medium text-gray-800">Update Frequency</td>
                                                    <td className="px-4 py-3 text-sm text-gray-600">One-time or periodic</td>
                                                    <td className="px-4 py-3 text-sm text-green-600 font-medium">Continuous</td>
                                                </tr>
                                                <tr>
                                                    <td className="px-4 py-3 text-sm font-medium text-gray-800">Purpose</td>
                                                    <td className="px-4 py-3 text-sm text-gray-600">Design & planning</td>
                                                    <td className="px-4 py-3 text-sm text-green-600 font-medium">Monitor, predict, optimize</td>
                                                </tr>
                                                <tr className="bg-gray-50">
                                                    <td className="px-4 py-3 text-sm font-medium text-gray-800">Connection</td>
                                                    <td className="px-4 py-3 text-sm text-gray-600">No link to physical object</td>
                                                    <td className="px-4 py-3 text-sm text-green-600 font-medium">Always connected</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* New: Industry Applications */}
                                <div className="mt-8 pt-8 border-t border-gray-200">
                                    <h3 className="text-xl font-bold text-gray-800 mb-4">Where Digital Twins Are Used</h3>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                        <div className="bg-blue-50 rounded-lg p-3 text-center">
                                            <div className="text-2xl mb-1">🏭</div>
                                            <div className="text-xs font-medium text-gray-700">Manufacturing</div>
                                        </div>
                                        <div className="bg-green-50 rounded-lg p-3 text-center">
                                            <div className="text-2xl mb-1">🏗️</div>
                                            <div className="text-xs font-medium text-gray-700">Construction</div>
                                        </div>
                                        <div className="bg-purple-50 rounded-lg p-3 text-center">
                                            <div className="text-2xl mb-1">⚡</div>
                                            <div className="text-xs font-medium text-gray-700">Energy</div>
                                        </div>
                                        <div className="bg-orange-50 rounded-lg p-3 text-center">
                                            <div className="text-2xl mb-1">🚗</div>
                                            <div className="text-xs font-medium text-gray-700">Automotive</div>
                                        </div>
                                        <div className="bg-red-50 rounded-lg p-3 text-center">
                                            <div className="text-2xl mb-1">🏥</div>
                                            <div className="text-xs font-medium text-gray-700">Healthcare</div>
                                        </div>
                                        <div className="bg-indigo-50 rounded-lg p-3 text-center">
                                            <div className="text-2xl mb-1">✈️</div>
                                            <div className="text-xs font-medium text-gray-700">Aerospace</div>
                                        </div>
                                        <div className="bg-yellow-50 rounded-lg p-3 text-center">
                                            <div className="text-2xl mb-1">🏙️</div>
                                            <div className="text-xs font-medium text-gray-700">Smart Cities</div>
                                        </div>
                                        <div className="bg-pink-50 rounded-lg p-3 text-center">
                                            <div className="text-2xl mb-1">🛢️</div>
                                            <div className="text-xs font-medium text-gray-700">Oil & Gas</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeSection === 'demo' && (
                            <div className="bg-white rounded-2xl shadow-xl p-8">
                                <h2 className="text-2xl font-bold text-gray-800 mb-2">Interactive Demo: Factory Machine</h2>
                                <p className="text-gray-600 mb-6">Watch how real-world sensor data updates the digital twin in real-time</p>
                                
                                {/* Alert Banner */}
                                {(temperature > 85 || speed > 1400) && (
                                    <div className="mb-6 bg-orange-50 border-l-4 border-orange-500 p-4 rounded">
                                        <div className="flex items-center gap-2">
                                            <span className="text-orange-500 text-xl">⚠️</span>
                                            <div>
                                                <h4 className="font-bold text-orange-800">Alert: Machine Parameter Out of Range</h4>
                                                <p className="text-sm text-orange-700">
                                                    {temperature > 85 && "Temperature exceeding safe operating limits. "}
                                                    {speed > 1400 && "RPM is too high. "}
                                                    Predictive maintenance recommended within 2 hours.
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="grid md:grid-cols-2 gap-8">
                                    {/* Physical Object */}
                                    <div className="border-4 border-blue-500 rounded-xl p-6 bg-blue-50">
                                        <h3 className="text-xl font-bold text-blue-800 mb-4 flex items-center gap-2">
                                            <span>🏭</span> Physical Machine
                                        </h3>
                                        <div className="bg-white rounded-lg p-6 mb-4">
                                            <div className="w-32 h-32 mx-auto bg-gradient-to-br from-gray-700 to-gray-900 rounded-lg relative overflow-hidden">
                                                {isRunning && (
                                                    <>
                                                        <div className="absolute inset-0 bg-blue-400 opacity-20 animate-pulse"></div>
                                                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                                                            <SettingsIcon className="w-16 h-16 text-blue-300 animate-spin" style={{ animationDuration: '2s' }} />
                                                        </div>
                                                    </>
                                                )}
                                                {!isRunning && (
                                                    <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                                                        <SettingsIcon className="w-16 h-16 text-gray-500" />
                                                    </div>
                                                )}
                                            </div>
                                            <p className="text-center mt-4 font-medium text-gray-700">
                                                {isRunning ? 'Running' : 'Stopped'}

                                                    <span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full">● CONNECTED</span>
                                                </div>
                                                <div className="space-y-3">
                                                    <div>
                                                        <div className="flex items-center justify-between mb-1">
                                                            <div className="flex items-center gap-2 text-orange-600">
                                                                <ThermometerIcon className="w-5 h-5" />
                                                                <span className="font-mono text-lg">{temperature.toFixed(1)}°F</span>

                                                                {temperature > 80 ? 'HIGH' : 'NORMAL'}

                                                        <div className="bg-gray-200 rounded-full h-2">

                                                                {speed > 1350 ? 'HIGH' : 'NORMAL'}
                                                            </span>
                                                        </div>
                                                        <div className="bg-gray-200 rounded-full h-2">

                                                                className={`h-2 rounded-full transition-all ${speed > 1400 ? 'bg-red-500' : speed > 1350 ? 'bg-orange-500' : 'bg-blue-500'}`}

                                                            <span>1500</span>
