<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Launcher</title>
    <style>
        :root {
            --primary-color: #ff4b4b; /* Streamlit Red */
            --bg-color: #0e1117;
            --card-bg: #262730;
            --text-color: #fafafa;
        }

        body {
            font-family: "Source Sans Pro", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.75rem;
        }

        p {
            opacity: 0.8;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            height: 250px;
            background-color: #0e1117;
            border: 1px solid #464855;
            border-radius: 0.25rem;
            color: white;
            padding: 10px;
            box-sizing: border-box;
            font-family: monospace;
            resize: vertical;
            margin: 1rem 0;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        #status {
            margin-top: 1rem;
            padding: 0.5rem;
            border-radius: 0.25rem;
            display: none;
            font-size: 0.9rem;
            background-color: rgba(28, 131, 225, 0.1);
            border: 1px solid #1c83e1;
            color: #1c83e1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📑 Multi-Tab Launcher</h1>
    <p>Paste your links and open them all as new tabs.</p>
    
    <textarea id="urlsInput" placeholder="https://google.com&#10;https://wikipedia.org&#10;https://github.com"></textarea>
    
    <button onclick="launchTabs()">Open All in New Tabs</button>
    
    <div id="status"></div>
</div>

<script>
    function launchTabs() {
        const textArea = document.getElementById('urlsInput');
        const statusDiv = document.getElementById('status');
        
        // Split by lines, trim whitespace, and filter out empty strings
        const urls = textArea.value.split('\n')
            .map(url => url.trim())
            .filter(url => url.length > 0);

        if (urls.length === 0) {
            alert("Please enter at least one URL.");
            return;
        }

        urls.forEach(url => {
            // Ensure URL has a protocol
            let formattedUrl = url;
            if (!/^https?:\/\//i.test(url)) {
                formattedUrl = 'https://' + url;
            }
            window.open(formattedUrl, '_blank');
        });

        // Show success status
        statusDiv.style.display = 'block';
        statusDiv.innerText = `🚀 Launching ${urls.length} tabs!`;
        
        // Hide status after 3 seconds
        setTimeout(() => {
            statusDiv.style.display = 'none';
        }, 3000);
    }
</script>

</body>
</html>
